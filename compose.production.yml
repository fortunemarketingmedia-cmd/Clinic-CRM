name: revive-crm

x-app-security: &app-security
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m

services:
  postgres:
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=100"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2.0

  redis:
    image: redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 320m
    cpus: 0.5

  clamav:
    image: clamav/clamav:1.4.6@sha256:4cc4350d3fded380caf1799e76c0d1c93f3fa40af99c0cb2862ec0c9b117718a
    restart: unless-stopped
    networks:
      - data
      - egress
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 1.0

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    env_file:
      - ${HOSTINGER_ENV_FILE:-deploy/hostinger/.env.hostinger}
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:?Set DATABASE_URL}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
    volumes:
      - patient_files:/private-files
    profiles: ["tools"]
    security_opt:
      - no-new-privileges:true

  backend:
    <<: *app-security
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      PORT: "${PORT:-4000}"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-0}"
      NODE_ENV: production
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-}"
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-15m}"
      REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-7d}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-7}"
      REFRESH_TOKEN_COOKIE_NAME: "${REFRESH_TOKEN_COOKIE_NAME:-revive_refresh_token}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      FRONTEND_URLS: "${FRONTEND_URLS:-}"
      FILE_STORAGE_PROVIDER: "${FILE_STORAGE_PROVIDER:-local}"
      FILE_STORAGE_ROOT: "${FILE_STORAGE_ROOT:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-ap-south-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
      S3_KEY_PREFIX: "${S3_KEY_PREFIX:-revive-crm}"
      S3_SERVER_SIDE_ENCRYPTION: "${S3_SERVER_SIDE_ENCRYPTION:-none}"
      S3_KMS_KEY_ID: "${S3_KMS_KEY_ID:-}"
      FILE_ENCRYPTION_KEY: "${FILE_ENCRYPTION_KEY:-}"
      FILE_ACCESS_SECRET: "${FILE_ACCESS_SECRET:-}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-10485760}"
      MIN_STORAGE_FREE_BYTES: "${MIN_STORAGE_FREE_BYTES:-1073741824}"
      MAX_IMAGE_PIXELS: "${MAX_IMAGE_PIXELS:-64000000}"
      REDIS_URL: "${REDIS_URL:-}"
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-revive:}"
      RUN_BACKGROUND_WORKER: "false"
      METRICS_SECRET: "${METRICS_SECRET:-}"
      CLAMAV_HOST: "${CLAMAV_HOST:-}"
      CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
      FILE_SCAN_REQUIRED: "${FILE_SCAN_REQUIRED:-false}"
      GOOGLE_ADS_INGEST_SECRET: "${GOOGLE_ADS_INGEST_SECRET:-}"
      META_ADS_INGEST_SECRET: "${META_ADS_INGEST_SECRET:-}"
      WEBSITE_LEAD_INGEST_SECRET: "${WEBSITE_LEAD_INGEST_SECRET:-}"
      EMAIL_ENABLED: "${EMAIL_ENABLED:-false}"
      WHATSAPP_ENABLED: "${WHATSAPP_ENABLED:-false}"
      PAYMENT_GATEWAY_ENABLED: "${PAYMENT_GATEWAY_ENABLED:-false}"
      PAYMENT_GATEWAY_SECRET: "${PAYMENT_GATEWAY_SECRET:-}"
      INTEGRATION_ENCRYPTION_KEY: "${INTEGRATION_ENCRYPTION_KEY:-}"
      META_GRAPH_API_URL: "${META_GRAPH_API_URL:-https://graph.facebook.com}"
      META_GRAPH_API_VERSION: "${META_GRAPH_API_VERSION:-v23.0}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_BUSINESS_ACCOUNT_ID: "${WHATSAPP_BUSINESS_ACCOUNT_ID:-}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_APPOINTMENT_TEMPLATE_NAME: "${WHATSAPP_APPOINTMENT_TEMPLATE_NAME:-appointment_confirmation}"
      WHATSAPP_APPOINTMENT_TEMPLATE_LANGUAGE: "${WHATSAPP_APPOINTMENT_TEMPLATE_LANGUAGE:-en_US}"
      GOOGLE_ADS_API_URL: "${GOOGLE_ADS_API_URL:-https://googleads.googleapis.com}"
      GOOGLE_ADS_API_VERSION: "${GOOGLE_ADS_API_VERSION:-v20}"
      GOOGLE_OAUTH_TOKEN_URL: "${GOOGLE_OAUTH_TOKEN_URL:-https://oauth2.googleapis.com/token}"
      GOOGLE_OAUTH_AUTH_URL: "${GOOGLE_OAUTH_AUTH_URL:-https://accounts.google.com/o/oauth2/v2/auth}"
      BACKEND_PUBLIC_URL: "${BACKEND_PUBLIC_URL:-http://localhost:4000}"
      INTEGRATION_JOB_POLL_MS: "${INTEGRATION_JOB_POLL_MS:-10000}"
      INTEGRATION_WORKER_ID: "${INTEGRATION_WORKER_ID:-revive-integration-worker}"
      PROVIDER_REQUEST_TIMEOUT_MS: "${PROVIDER_REQUEST_TIMEOUT_MS:-20000}"
      SHUTDOWN_TIMEOUT_MS: "${SHUTDOWN_TIMEOUT_MS:-10000}"
      MFA_ISSUER: "${MFA_ISSUER:-Revive Clinic CRM}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    volumes:
      - patient_files:/private-files
    ports:
      - "127.0.0.1:4100:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    mem_limit: 1g
    cpus: 1.5

  worker:
    <<: *app-security
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/src/worker.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      PORT: "${PORT:-4000}"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-0}"
      NODE_ENV: production
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-}"
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-15m}"
      REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-7d}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-7}"
      REFRESH_TOKEN_COOKIE_NAME: "${REFRESH_TOKEN_COOKIE_NAME:-revive_refresh_token}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      FRONTEND_URLS: "${FRONTEND_URLS:-}"
      FILE_STORAGE_PROVIDER: "${FILE_STORAGE_PROVIDER:-local}"
      FILE_STORAGE_ROOT: "${FILE_STORAGE_ROOT:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-ap-south-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
      S3_KEY_PREFIX: "${S3_KEY_PREFIX:-revive-crm}"
      S3_SERVER_SIDE_ENCRYPTION: "${S3_SERVER_SIDE_ENCRYPTION:-none}"
      S3_KMS_KEY_ID: "${S3_KMS_KEY_ID:-}"
      FILE_ENCRYPTION_KEY: "${FILE_ENCRYPTION_KEY:-}"
      FILE_ACCESS_SECRET: "${FILE_ACCESS_SECRET:-}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-10485760}"
      MIN_STORAGE_FREE_BYTES: "${MIN_STORAGE_FREE_BYTES:-1073741824}"
      MAX_IMAGE_PIXELS: "${MAX_IMAGE_PIXELS:-64000000}"
      REDIS_URL: "${REDIS_URL:-}"
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-revive:}"
      RUN_BACKGROUND_WORKER: "true"
      METRICS_SECRET: "${METRICS_SECRET:-}"
      CLAMAV_HOST: "${CLAMAV_HOST:-}"
      CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
      FILE_SCAN_REQUIRED: "${FILE_SCAN_REQUIRED:-false}"
      GOOGLE_ADS_INGEST_SECRET: "${GOOGLE_ADS_INGEST_SECRET:-}"
      META_ADS_INGEST_SECRET: "${META_ADS_INGEST_SECRET:-}"
      WEBSITE_LEAD_INGEST_SECRET: "${WEBSITE_LEAD_INGEST_SECRET:-}"
      EMAIL_ENABLED: "${EMAIL_ENABLED:-false}"
      WHATSAPP_ENABLED: "${WHATSAPP_ENABLED:-false}"
      PAYMENT_GATEWAY_ENABLED: "${PAYMENT_GATEWAY_ENABLED:-false}"
      PAYMENT_GATEWAY_SECRET: "${PAYMENT_GATEWAY_SECRET:-}"
      INTEGRATION_ENCRYPTION_KEY: "${INTEGRATION_ENCRYPTION_KEY:-}"
      META_GRAPH_API_URL: "${META_GRAPH_API_URL:-https://graph.facebook.com}"
      META_GRAPH_API_VERSION: "${META_GRAPH_API_VERSION:-v23.0}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_BUSINESS_ACCOUNT_ID: "${WHATSAPP_BUSINESS_ACCOUNT_ID:-}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_APPOINTMENT_TEMPLATE_NAME: "${WHATSAPP_APPOINTMENT_TEMPLATE_NAME:-appointment_confirmation}"
      WHATSAPP_APPOINTMENT_TEMPLATE_LANGUAGE: "${WHATSAPP_APPOINTMENT_TEMPLATE_LANGUAGE:-en_US}"
      GOOGLE_ADS_API_URL: "${GOOGLE_ADS_API_URL:-https://googleads.googleapis.com}"
      GOOGLE_ADS_API_VERSION: "${GOOGLE_ADS_API_VERSION:-v20}"
      GOOGLE_OAUTH_TOKEN_URL: "${GOOGLE_OAUTH_TOKEN_URL:-https://oauth2.googleapis.com/token}"
      GOOGLE_OAUTH_AUTH_URL: "${GOOGLE_OAUTH_AUTH_URL:-https://accounts.google.com/o/oauth2/v2/auth}"
      BACKEND_PUBLIC_URL: "${BACKEND_PUBLIC_URL:-http://localhost:4000}"
      INTEGRATION_JOB_POLL_MS: "${INTEGRATION_JOB_POLL_MS:-10000}"
      INTEGRATION_WORKER_ID: revive-worker-1
      PROVIDER_REQUEST_TIMEOUT_MS: "${PROVIDER_REQUEST_TIMEOUT_MS:-20000}"
      SHUTDOWN_TIMEOUT_MS: "${SHUTDOWN_TIMEOUT_MS:-10000}"
      MFA_ISSUER: "${MFA_ISSUER:-Revive Clinic CRM}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    volumes:
      - patient_files:/private-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
      - egress
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    cpus: 1.5

  frontend:
    <<: *app-security
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in the Hostinger environment file}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/frontend/.next/cache:rw,noexec,nosuid,uid=1000,gid=1000,size=128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    mem_limit: 1g
    cpus: 1.5


  database-backup:
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      MIN_BACKUP_FREE_KIB: ${MIN_BACKUP_FREE_KIB:-10485760}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${BACKUP_HOST_PATH:-/srv/revive-crm/backups}:/backups
      - ./deploy/backup/postgres-backup.sh:/usr/local/bin/revive-postgres-backup:ro
    entrypoint: ["/usr/local/bin/revive-postgres-backup"]
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name .database-success -mmin -1500 | grep -q ."]
      interval: 30s
      start_period: 2m

  file-backup:
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    restart: unless-stopped
    network_mode: none
    depends_on:
      database-backup:
        condition: service_healthy
    environment:
      RESTIC_REPOSITORY: /backups/private-restic
      RESTIC_PASSWORD: ${LOCAL_BACKUP_PASSWORD:?Set LOCAL_BACKUP_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      MIN_BACKUP_FREE_KIB: ${MIN_BACKUP_FREE_KIB:-10485760}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-14}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-8}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-12}
    volumes:
      - patient_files:/private-files:ro
      - ${BACKUP_HOST_PATH:-/srv/revive-crm/backups}:/backups
      - ./deploy/backup/restic-backup.sh:/config/backup.sh:ro
    entrypoint: ["/bin/sh", "/config/backup.sh", "local"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name .local-success -mmin -1500 | grep -q ."]
      interval: 30s
      start_period: 2m

  offsite-backup:
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    profiles: ["offsite"]
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      LOCAL_BACKUP_PASSWORD: ${LOCAL_BACKUP_PASSWORD:?Set LOCAL_BACKUP_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${OFFSITE_BACKUP_INTERVAL_SECONDS:-86400}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-14}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-8}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-12}
    volumes:
      - ${BACKUP_HOST_PATH:-/srv/revive-crm/backups}:/backups
      - ${OFFSITE_SSH_DIR:-./deploy/hostinger/offsite-ssh}:/root/.ssh:ro
      - ./deploy/backup/restic-backup.sh:/config/backup.sh:ro
    entrypoint: ["/bin/sh", "/config/backup.sh", "offsite"]
    networks: [egress]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name .offsite-success -mmin -1500 | grep -q ."]
      interval: 5m
      start_period: 10m

networks:
  edge:
  egress:
  data:
    internal: true

volumes:
  postgres_data:
  patient_files:
