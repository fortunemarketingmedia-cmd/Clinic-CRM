name: revive-crm

x-app-security: &app-security
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m

services:
  postgres:
    image: postgres:17.6-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=100"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2.0

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 320m
    cpus: 0.5

  clamav:
    image: clamav/clamav:1.4
    profiles: ["malware-scan"]
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-revive-crm}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    depends_on:
      - minio
    networks:
      - data
    entrypoint: ["/bin/sh", "/config/init-minio.sh"]
    volumes:
      - ./deploy/minio/init-minio.sh:/config/init-minio.sh:ro
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    env_file:
      - ${HOSTINGER_ENV_FILE:-deploy/hostinger/.env.hostinger}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
    profiles: ["tools"]
    security_opt:
      - no-new-privileges:true

  backend:
    <<: *app-security
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ${HOSTINGER_ENV_FILE:-deploy/hostinger/.env.hostinger}
    environment:
      RUN_BACKGROUND_WORKER: "false"
    ports:
      - "127.0.0.1:4100:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    mem_limit: 1g
    cpus: 1.5

  worker:
    <<: *app-security
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/src/worker.js"]
    restart: unless-stopped
    env_file:
      - ${HOSTINGER_ENV_FILE:-deploy/hostinger/.env.hostinger}
    environment:
      RUN_BACKGROUND_WORKER: "true"
      INTEGRATION_WORKER_ID: revive-worker-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - data
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    cpus: 1.5

  frontend:
    <<: *app-security
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in the Hostinger environment file}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/frontend/.next/cache:rw,noexec,nosuid,uid=1000,gid=1000,size=128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    mem_limit: 1g
    cpus: 1.5


  database-backup:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${BACKUP_HOST_PATH:-/srv/revive-crm/backups}:/backups
      - ./deploy/backup/postgres-backup.sh:/usr/local/bin/revive-postgres-backup:ro
    entrypoint: ["/usr/local/bin/revive-postgres-backup"]
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.75

  file-backup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: unless-stopped
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-revive-crm}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      MC_CONFIG_DIR: /tmp/.mc
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ${BACKUP_HOST_PATH:-/srv/revive-crm/backups}:/backups
      - ./deploy/backup/object-backup.sh:/config/object-backup.sh:ro
    entrypoint: ["/bin/sh", "/config/object-backup.sh"]
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 512m
    cpus: 0.75

  offsite-backup:
    image: restic/restic:0.17.3
    profiles: ["offsite"]
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      OFFSITE_BACKUP_INTERVAL_SECONDS: ${OFFSITE_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_HOST_PATH:-/srv/revive-crm/backups}:/backups:ro
      - ./deploy/backup/restic-backup.sh:/usr/local/bin/revive-offsite-backup:ro
      - restic_cache:/root/.cache/restic
    entrypoint: ["/usr/local/bin/revive-offsite-backup"]
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  minio_data:
  restic_cache:
